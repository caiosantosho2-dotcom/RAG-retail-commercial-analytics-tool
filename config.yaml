# Parâmetros centrais do projeto. Nada disso deve ficar espalhado no código.

semente: 42

dados:
  pasta_raw: data/raw
  pasta_processed: data/processed
  kaggle_dataset: frtgnn/dunnhumby-the-complete-journey
  data_base: "2016-01-01"   # DAY=1 -> data_base + 0 dias; arbitrária (o dataset não tem calendário real)

janela:
  # A janela termina na última WEEK_NO com 7 dias (decisão A da fase 3): hoje a 101, pois a 102 tem 6.
  semanas_atuais: 26
  offset_ano_anterior: 52   # base de comparação: WEEK_NO - 52

metricas:
  cliente_ativo_semanas: 8        # >= 1 compra nas últimas N semanas do período (p95 do intervalo entre compras = 5 sem, p99 = 11)
  loja_amostra_minima_cestas: 100 # loja com menos cestas na janela é marcada amostra_pequena (208 de 319 lojas, 1,1% do faturamento)

banco:
  arquivo: data/processed/dunnhumby.duckdb
  relatorio_qualidade: relatorios/qualidade.md
  tolerancia_reconciliacao_usd: 0.01

limpeza:
  # Decisão A (2026-10-05): combustível e pseudo-itens de cupom não são mercadoria.
  departamentos_excluidos: ["KIOSK-GAS", "MISC SALES TRAN", "MISC. TRANS.", "COUP/STR & MFG"]
  commodities_excluidas: ["COUPON/MISC ITEMS"]

consulta:
  limite_padrao: 20
  limite_maximo: 200
  timeout_segundos: 30
  memoria_maxima: "1GB"       # teto de memória do DuckDB na conexão do agente
  max_bytes_retorno: 60000    # nenhum retorno de ferramenta passa disso (controle de tokens)
  # Tabelas que o agente enxerga (padrões). Ficam de fora raw_*, fato_ajustes, log_cargas, meta e _mat_*.
  tabelas_permitidas: ["vw_*", "dim_*", "fato_transacoes", "campaign_*", "coupon*", "causal_semana_loja",
                       "metricas_definicao"]

logs:
  chamadas: logs/chamadas.jsonl   # uma linha por chamada de ferramenta (fora do Git)
  uso_chat: logs/uso_chat.jsonl   # pergunta, hora, SQL gerado e erro

agente:
  modelo: "llama-3.3-70b-versatile"
  modelos_disponiveis: ["llama-3.3-70b-versatile", "llama-3.1-8b-instant"]
  temperatura: 0
  max_iteracoes: 6
  glossario_top_k: 4
  glossario_limiar: 0.30

analises:
  rfm:
    # Regra de K, escrita antes de rodar (decisão da fase 5): entre K >= k_min, só entram os estáveis,
    # sem segmento pequeno demais e com estrutura minimamente visível; vence a maior silhueta.
    k_avaliados: [2, 3, 4, 5, 6, 7, 8]   # K=2 é avaliado e mostrado, mas só separa quem comprou há pouco de quem está em pausa
    k_min: 3
    ari_minimo: 0.90          # estabilidade: ARI mínima entre sementes e entre subamostras
    tamanho_minimo_pct: 5.0   # menor segmento, em % dos households
    silhueta_minima: 0.25     # abaixo disso não há estrutura de clusters visível
    n_sementes: 10            # reinicializações para medir estabilidade
    n_subamostras: 10
    fracao_subamostra: 0.8
    n_init: 10
  clv:
    margem: 0.25               # PREMISSA: o dataset não tem custo. Margem bruta típica de supermercado nos EUA: ~25%
    horizonte_semanas: 52      # igual a janela.offset_ano_anterior: a coorte da janela base tem 52 semanas observadas
    n_bootstrap: 2000
    nivel_ic: 0.95
    tamanho_minimo_grupo: 30   # grupo menor que isso na calibração: o resultado sai com aviso
  churn:
    # Churn = pausa longa: sem compra nas próximas `horizonte_semanas`. 8 semanas coincide com "cliente ativo" e com o limite
    # de "Em pausa" (56 dias). Na base, 72% a 84% de quem pausa volta em 18 semanas: não é saída definitiva.
    horizonte_semanas: 8
    historico_minimo_semanas: 16   # população: comprou nas últimas `metricas.cliente_ativo_semanas` e tem esse histórico
    janela_comportamento_semanas: 26
    # Fotos temporais, como deslocamentos de `semana_fim_atual` (101): treino T=30..68, validação T=77, teste T=85 e 93.
    treino_inicio_antes_do_fim: 71
    treino_fim_antes_do_fim: 33
    treino_passo_semanas: 4
    validacao_antes_do_fim: 24
    teste_antes_do_fim: [16, 8]
    retorno_janela_semanas: 18     # quantas semanas depois da pausa se mede o retorno
    l2_c: 1.0                      # logística com regularização L2, sem peso de classe (probabilidades calibradas)
    n_bootstrap: 500
    nivel_ic: 0.95
  teste_desconto:
    # Hipótese (escrita antes de rodar): os segmentos recebem desconto parecido. Kruskal-Wallis porque o % de desconto por
    # household é assimétrico e não normal em todos os grupos (Shapiro); post-hoc de Mann-Whitney com Holm só se o geral
    # for significativo. Significância sozinha não basta com ~2.400 households: o veredito exige também efeito.
    alfa: 0.05
    eta2_relevante: 0.01              # efeito relevante: eta² (Kruskal-Wallis) a partir de 1% da variação ...
    diferenca_relevante_pp: 1.0       # ... ou algum par com diferença de medianas >= 1 ponto percentual e IC que exclui zero
    compras_minimas_sensibilidade: 5  # repete o teste só com households de pelo menos 5 compras (o % de desconto é ruidoso com poucas)
    n_bootstrap: 2000
    nivel_ic: 0.95
  coorte:
    # A entrada no painel acontece nas semanas 1-20 (99,2% dos households) e quase nada depois: com blocos de
    # 8 semanas só 2 coortes teriam tamanho útil, com 4 semanas há 5. Entrada no painel não é cliente novo.
    bloco_semanas: 4
    coorte_minima_households: 30    # coortes menores são omitidas (e contadas)
