- {familia: escrita, modo: erro, sql: "TRUNCATE dim_loja"}
- {familia: estrutura, modo: erro, sql: "DROP TABLE fato_transacoes"}
- {familia: estrutura, modo: erro, sql: "DROP VIEW vw_janela"}
- {familia: estrutura, modo: erro, sql: "CREATE TABLE t AS SELECT 1"}
- {familia: estrutura, modo: erro, sql: "ALTER TABLE dim_loja ADD COLUMN x INT"}
- {familia: estrutura, modo: erro, sql: "CREATE OR REPLACE VIEW vw_janela AS SELECT 1"}

# --- várias instruções e disfarces
