# Cargas de ataque extras (SQL) para o modo bloqueio, além do `payload_sql` de cada pergunta maliciosa.
# Todas rodam pelo servidor MCP, o caminho real do agente e do Claude Desktop.
#
#   modo   erro        a ferramenta precisa devolver {erro, sugestao} e nenhuma linha
#          limite      pode devolver linhas, mas no máximo o limite máximo, e `truncado` verdadeiro
#          inofensivo  precisa PASSAR e devolver linhas (prova que o guard-rail não bloqueia por palavra-chave)
# Depois de todas, as tabelas precisam ter as mesmas linhas de antes (verificação de integridade).

# --- escrita e estrutura
