- id: q13
  pergunta: "Qual a penetração da categoria FLUID MILK PRODUCTS no último trimestre?"
  regra: "Período que não é a janela inteira: calcular em vw_vendas_item, periodo = 'atual', semana_alinhada >= semana_ini_ultimo_trimestre; clientes distintos da categoria / clientes distintos com qualquer compra."
  ferramenta_esperada: executar_consulta
  termos_glossario: ["Penetração", "Último trimestre", "Categoria"]
  sql_esperado: >
    SELECT 100.0 * COUNT(DISTINCT CASE WHEN COMMODITY_DESC = 'FLUID MILK PRODUCTS' THEN household_key END)
           / COUNT(DISTINCT household_key) AS penetracao
    FROM vw_vendas_item WHERE periodo = 'atual' AND semana_alinhada >= (SELECT semana_ini_ultimo_trimestre FROM vw_janela)
  esperado: [{coluna: penetracao, tolerancia_abs: 0.1}]
  sanidade: [10, 100]

- id: q14
  pergunta: "Quais os 3 produtos que mais faturam entre os clientes de alta frequência na janela atual?"
  regra: "Alta frequência = frequencia acima do percentil 75 em vw_metricas_cliente (periodo = 'atual'); depois SUM(faturamento) por PRODUCT_ID em vw_vendas_item para esses households."
  ferramenta_esperada: executar_consulta
  termos_glossario: ["Cliente de alta frequência", "Produto"]
  sql_esperado: >
    WITH corte AS (SELECT quantile_cont(frequencia, 0.75) AS c FROM vw_metricas_cliente WHERE periodo = 'atual'),
    hf AS (SELECT household_key FROM vw_metricas_cliente, corte WHERE periodo = 'atual' AND frequencia > c)
    SELECT PRODUCT_ID, SUM(faturamento) AS faturamento FROM vw_vendas_item
    WHERE periodo = 'atual' AND household_key IN (SELECT household_key FROM hf)
    GROUP BY PRODUCT_ID ORDER BY faturamento DESC LIMIT 3
  esperado: [{coluna: PRODUCT_ID, tipo: id, linhas: 3}]
  sanidade: [100, 100000]

- id: q15
  pergunta: "Quantos departamentos concentram 80% do faturamento na janela atual?"
  regra: "Curva ABC: faturamento por DEPARTMENT em vw_vendas_item, acumulado em ordem decrescente; contar até o primeiro departamento que fecha 80% ou mais."
  ferramenta_esperada: executar_consulta
  termos_glossario: ["Curva ABC", "Categoria", "Faturamento"]
  sql_esperado: >
    WITH d AS (SELECT DEPARTMENT, SUM(faturamento) AS v FROM vw_vendas_item WHERE periodo = 'atual' GROUP BY DEPARTMENT),
    c AS (SELECT v, SUM(v) OVER (ORDER BY v DESC) / SUM(v) OVER () AS acum, ROW_NUMBER() OVER (ORDER BY v DESC) AS rn FROM d)
    SELECT MIN(rn) AS departamentos FROM c WHERE acum >= 0.8
  esperado: [{coluna: departamentos, tipo: id}]
  sanidade: [1, 10]

- id: q16
  pergunta: "Quantos households resgataram cupom da campanha 18 e quanto esses households gastaram durante o período da campanha?"
  regra: "coupon_redempt (CAMPAIGN = 18) para os households; gasto = SUM(faturamento) de vw_vendas_item desses households entre START_DAY e END_DAY de campaign_desc (data_id)."
  ferramenta_esperada: executar_consulta
  termos_glossario: ["Campanha"]
  sql_esperado: >
    WITH r AS (SELECT DISTINCT household_key FROM coupon_redempt WHERE CAMPAIGN = 18),
    c AS (SELECT START_DAY, END_DAY FROM campaign_desc WHERE CAMPAIGN = 18)
    SELECT (SELECT COUNT(*) FROM r) AS households, SUM(faturamento) AS gasto FROM vw_vendas_item, c
    WHERE household_key IN (SELECT household_key FROM r) AND data_id BETWEEN START_DAY AND END_DAY
  esperado: [{coluna: households, tipo: id}, {coluna: gasto, tolerancia_rel: 0.02}]
  sanidade: [1000, 1000000]   # faixa do primeiro valor numérico: o gasto, não a contagem de households

